events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server_tokens off;

    # Anti-IDM Connection Rate Limiting
    limit_conn_zone $binary_remote_addr zone=anti_idm:10m;
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name video.yourdomain.com;

        # Security Headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # 1. Reverse Proxy to Node.js App
        location /api/ {
            proxy_pass http://localhost:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Direct HLS Static Stream Delivery
        location /hls-output/ {
            alias /var/www/storage/hls-output/;

            # IDM Threading Block (Max 2 Connection per IP)
            limit_conn anti_idm 2;
            limit_req zone=req_limit burst=5 nodelay;

            # Hotlink Protection
            valid_referers none blocked yourdomain.com *.yourdomain.com;
            if ($invalid_referer) {
                return 403;
            }

            # Disable Autoindex
            autoindex off;

            # CORS Settings for Frontend
            add_header 'Access-Control-Allow-Origin' 'https://yourdomain.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        }
    }
}